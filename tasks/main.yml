---

- name: "Include variables wrapper"
  ansible.builtin.include_tasks:
    file: variables.yml
  tags: ["ct-debug"]

- name: "Disto/Family tasks (FF)"
  ansible.builtin.include_tasks:
    file: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
      - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'].split('.')[0] }}.yml"
      - "{{ ansible_facts['distribution'] }}.yml"
      - "{{ ansible_facts['os_family'] }}.yml"
      - "default.yml"
  tags: ["ct-debug"]

- name: 'Connection test'
  ansible.builtin.ping:
  tags: ["ct-debug"]

- name: 'Dump some hostvars for the inventory hostname'
  ansible.builtin.debug:
    var: '{{ item }}'
  with_items:
  - hostvars[inventory_hostname]['ansible_facts']['default_ipv4']['address']
  tags: ["ct-debug"]

- name: 'Dump some CT variables'
  ansible.builtin.debug:
    var: '{{ item }}'
  with_items:
  - ct_cloud
  - ct_provider
  tags: ["ct-debug"]

- name: 'Dump some fact based variables'
  ansible.builtin.debug:
    var: '{{ item }}'
  with_items:
  - ansible_facts['architecture']
  - ansible_facts['distribution']
  - ansible_facts['distribution_major_version']
  - ansible_facts['distribution_release']
  - ansible_facts['os_family']
  - ansible_facts['virtualization_role']
  - ansible_facts['virtualization_type']
  tags: ["ct-debug"]

...
