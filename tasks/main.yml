---

- name: 'Connection test'
  ansible.builtin.ping:
  tags: ct-debug

- name: 'Dump some hostvars for the inventory hostname'
  ansible.builtin.debug:
    var: '{{ item }}'
  with_items:
  - hostvars[inventory_hostname]['ansible_facts']['default_ipv4']['address']
  tags: ct-debug

- name: 'Dump some CT variables'
  ansible.builtin.debug:
    var: '{{ item }}'
  with_items:
  - ct_cloud
  - ct_provider
  tags: ct-debug

- name: 'Dump some fact based variables'
  ansible.builtin.debug:
    var: '{{ item }}'
  with_items:
  - ct_arch
  - ct_codename
  - ct_distro
  - ct_distro_major
  - ct_family
  - ct_hypervisor
  - ct_opsys
  - ct_virt_role
  tags: ct-debug

...
